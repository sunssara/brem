<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><style>
:root{color-scheme:dark;--bg:#101113;--ink:#f3f2ef;--muted:#a5a7ac;--line:#2b2d32;--accent:#E83F4C}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}a:focus-visible{outline:2px solid var(--accent);outline-offset:7px;border-radius:3px}
.shell{max-width:1440px;margin:auto;padding:0 64px}
header{height:122px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.identity{display:flex;align-items:center;gap:17px}.logo{position:relative;width:174px;height:40px;overflow:hidden}.logo img{position:absolute;width:302px;height:176px;max-width:none;left:-64px;top:-68px}.group{font-size:13px;letter-spacing:.18em;color:#c5c6c9;padding-left:16px;border-left:1px solid #505156}
.status{display:flex;align-items:center;gap:10px;color:#c5c6c9;font-size:12px;letter-spacing:.025em}.status i{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px #E83F4C0c}
.hero{position:relative;display:grid;grid-template-columns:1.3fr 1fr;align-items:center;min-height:595px;padding:66px 0 60px;isolation:isolate}
.eyebrow{display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.18em;font-weight:700;color:#b9bbc0}.eyebrow:before{content:"";width:24px;height:2px;background:var(--accent)}
h1{font-size:clamp(40px,4.8vw,68px);line-height:1.05;letter-spacing:-.055em;margin:27px 0 24px;font-weight:600}h1 span{color:var(--accent)}
.intro{max-width:510px;color:var(--muted);font-size:16px;line-height:1.75;margin:0 0 30px}
.cta{display:inline-flex;align-items:center;justify-content:space-between;gap:40px;padding:18px 24px;background:var(--accent);color:#111216;font-size:14px;font-weight:700;border-radius:3px;transition:background .2s,transform .2s}.cta:hover{background:#E83F4C;transform:translateY(-2px)}.cta svg{width:18px;height:18px}
.art{position:relative;align-self:stretch;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-left:12px}
.art:before{position:absolute;inset:0;content:"";background:radial-gradient(ellipse at 60% 48%,#E83F4C0c,transparent 65%)}
.art svg{width:100%;max-width:470px;height:auto;position:relative}
.art-caption{position:absolute;bottom:14px;right:5px;color:#6e7179;font-size:10px;letter-spacing:.18em;display:flex;align-items:center;gap:12px}.art-caption:before{content:"";width:35px;height:1px;background:#41444b}
.services{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:27px 0}
.service{display:flex;align-items:center;gap:20px;padding:4px 28px;border-left:1px solid var(--line)}.service:first-child{padding-left:0;border:0}.service:last-child{padding-right:0}.num{color:var(--accent);font-size:11px;letter-spacing:.08em;font-family:Montserrat,Arial,sans-serif}.service h2{font-size:15px;font-weight:400;line-height:1.5;margin:0}
.contact{display:grid;grid-template-columns:1fr 1.05fr 1fr;gap:30px;padding:43px 0 46px;align-items:start}.contact-title{font-size:23px;line-height:1.3;letter-spacing:-.025em;margin:0 0 9px;font-weight:500}.contact p{font-size:13px;color:var(--muted);margin:0;line-height:1.6}.label{font-size:10px;color:#83868e;letter-spacing:.16em;display:block;margin:2px 0 14px}.email{font-size:25px;letter-spacing:-.035em;display:inline-flex;gap:22px;align-items:center}.email span{color:var(--accent);font-size:24px}.contact a:hover{color:var(--accent)}.phones{display:flex;flex-direction:column;gap:9px;font-size:17px;letter-spacing:.015em}
footer{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:23px 0 28px;border-top:1px solid var(--line);color:#757881;font-size:11px;letter-spacing:.025em}
@media(min-width:1600px){.hero{min-height:660px}.shell{padding:0 80px}}
@media(max-width:1000px){.shell{padding:0 36px}.hero{min-height:560px;grid-template-columns:1.4fr 1fr}h1{font-size:52px}.intro{font-size:15px}.service{padding:4px 18px;gap:14px}.service h2{font-size:13px}.contact{grid-template-columns:1fr 1fr;row-gap:28px}.contact>div:first-child{grid-column:1/-1}.art-caption{font-size:8px}}
@media(max-width:650px){.shell{padding:0 24px}header{height:100px}.identity{gap:5px}.logo{width:122px;height:30px}.logo img{width:211.4px;height:123.2px;left:-44.8px;top:-47.6px}.group{font-size:10px;padding-left:10px;letter-spacing:.12em}.status{max-width:96px;font-size:10px;line-height:1.5;gap:9px}.status i{flex-shrink:0}
.hero{display:block;min-height:auto;padding:47px 0 37px}.eyebrow{font-size:9px;letter-spacing:.13em}h1{font-size:clamp(37px,9.5vw,58px);line-height:1.08;margin:25px 0 22px;letter-spacing:-.055em}.intro{font-size:14px;line-height:1.8;max-width:450px}.cta{padding:17px 22px;gap:38px}.art{height:200px;margin:26px 0 -8px}.art svg{width:245px}.art-caption{right:0;bottom:5px;font-size:8px}.services{grid-template-columns:1fr;padding:7px 0}.service,.service:first-child,.service:last-child{border-left:0;border-bottom:1px solid var(--line);padding:18px 0;gap:23px}.service:last-child{border-bottom:0}.service h2{font-size:14px}.contact{grid-template-columns:1fr;gap:29px;padding:34px 0}.contact>div:first-child{grid-column:auto}.contact-title{font-size:25px}.label{margin-bottom:11px}.email{font-size:27px}.phones{font-size:18px;gap:13px}footer{align-items:flex-start;flex-direction:column;gap:9px;padding:22px 0 26px;font-size:10px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.cta{transition:none}}

/* Original vector logo and restrained motion. */
.identity{display:block;width:207px;line-height:0}.identity>svg{width:100%;height:auto;display:block}
.reconstruction{font-size:17px;line-height:1.6;margin:0 0 14px;color:#e0dfe2;max-width:480px}
.intro{font-size:14px;line-height:1.85;max-width:440px;margin-bottom:0}
h1{font-size:clamp(40px,4.6vw,66px);line-height:1.09;margin-bottom:25px}
.hero>div:first-child{animation:arrive .85s both}.services{animation:arrive .85s .12s both}.contact{animation:arrive .85s .24s both}
.art{overflow:visible}.art:before{animation:glow 7s ease-in-out infinite}.brand-symbol{transform-origin:50% 50%;animation:float 6s ease-in-out infinite}
.traces{stroke-dasharray:1050;stroke-dashoffset:1050;animation:trace 3s .25s ease-out forwards}
.status i{animation:pulse 3s ease-in-out infinite}.contact a{transition:color .2s}.contact-title{font-size:22px}
.motion-toggle{font:inherit;color:#a5a7ac;background:transparent;border:1px solid #33363c;border-radius:30px;padding:8px 12px;cursor:pointer;white-space:nowrap}.motion-toggle:hover{color:#f3f2ef;border-color:#6e7179}.motion-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
footer{flex-wrap:wrap}.motion-off *, .motion-off *:before{animation:none!important}.motion-off .traces{stroke-dashoffset:0}
@keyframes arrive{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes trace{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px #E83F4C10}50%{box-shadow:0 0 0 8px #E83F4C06}}
@media(max-width:1000px) and (min-width:651px){h1{font-size:45px}}
@media(max-width:650px){.identity{width:147px}.hero{padding-top:43px}h1{font-size:clamp(35px,9.3vw,58px)}.reconstruction{font-size:15px;line-height:1.7}.intro{font-size:13px}.art{margin-top:30px;height:215px}.contact-title{font-size:23px}.art-caption{font-size:8px}footer{gap:15px}.motion-toggle{font-size:10px}.status{max-width:105px}}
@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}.traces{stroke-dashoffset:0}.motion-toggle{display:none}}
.contact{border-top:1px solid var(--line)}
h1{margin-top:0}
</style>
</head>

<script>
const motionButton = document.querySelector('.motion-toggle');
motionButton.addEventListener('click', () => {
  const stopped = document.body.classList.toggle('motion-off');
  motionButton.setAttribute('aria-pressed', String(!stopped));
  motionButton.setAttribute('aria-label', stopped ? 'Включить анимацию' : 'Остановить анимацию');
  motionButton.textContent = stopped ? 'Анимация: выкл.' : 'Анимация: вкл.';
});
